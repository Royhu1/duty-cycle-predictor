# Tool configuration ONLY — this repository is NOT packaged or distributed as a Python
# package (no [build-system] / [project] tables). The dcpredictor package at the
# repository root is imported directly: run from the repo root, or add the root to
# sys.path as the demo notebooks do. The package version lives in dcpredictor/version.py.

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["dcpredictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "flexpolyline.*",
    "scipy.*",
    "matplotlib.*",
]
ignore_missing_imports = true
